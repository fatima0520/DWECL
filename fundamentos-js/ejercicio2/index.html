<body>

    <div class="contenedor">

        <h1>Ejercicio 2</h1>

        <h2>Array de 100 números</h2>

        <p class="enunciado">
            Declara un array de 100 números. Rellena el array con valores
            al azar. Muestra el contenido con console.table().
            Realiza un filtrado de datos mostrando los valores de un
            determinado rango.
        </p>

        <h2>Números filtrados</h2>

        <p>
            Mostramos los números entre <strong>20 y 50</strong>.
        </p>

        <div id="resultado"></div>

    </div>

    <script src="script.js"></script>
